# dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/images/logo.png"

  android: "launcher_icon"
  min_sdk_android: 21
  adaptive_icon_foreground: "assets/images/logo.png"
  adaptive_icon_background: "#00D5ED"

  ios: true
  # iOS icons cannot have an alpha channel; flatten the transparent white logo
  # onto the app's dark background so it doesn't render as a black icon.
  remove_alpha_ios: true
  background_color_ios: "#1B1B1B"
